<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAN Login Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body >
    <header class="fixed w-full bg-white shadow-sm z-40 top-0">
      <!-- header  tage -->
      <!-- z-50 le muni jada ni content banda mathi nai dekhairakhxa -->
      <!-- fixed le navbar lai fixed banaera rakhxa -->
      <!-- width full screen hos ani muni normal shadow hos -->
      <div
        class="max-w-[1450px] max-h-[101px] mx-auto flex items-center justify-between px-12 py-6"
      >
        <div class="shadow-md ring-2 ring-blue-400 ml-20">
          <img
            src="assets/images/canlogo.png"
            alt="Logo"
            class="w-[177px] h-[87px] object-contain"
          />
          <!-- here object contain  ring le bahira box banako xa ,le chau over strectch nahos vanera herxa-->
        </div>

        <nav>
          <ul
            class="flex text-xl text-gray-800 font-sans font-semibold gap-5 items-center mr-10"
          >
            <li class="hover:text-red-500">Services</li>
            <li class="hover:text-red-500">About</li>
            <li class="hover:text-red-500">Partner</li>
            <li class="hover:text-red-500">SignUp</li>
            <li class="hover:text-red-500">Login</li>
            <img src="assets/icons/icon1.png" alt="homeicon" class="mx-20" />
          </ul>
        </nav>
      </div>
    </header>

    <main class="h-full mt-[150px]">
      <section
        class="relative flex flex-col items-center justify-center w-[1380px] h-[998px] bg-cover bg-center rounded-3xl mx-[60px] overflow-hidden"
        style="background-image: url('assets/images/image\ 15.png')"
      >
        <div class="absolute inset-0 bg-white/40"></div>

        <p class="text-4xl text-center font-semibold z-10 mt-10">
          Login to your account
        </p>

        <div
          class="bg-red-400/55 w-[716px] flex flex-col h-[650px] items-center rounded-4xl px-4 py-4 p-10 mt-2"
        >
          <div class="relative w-full h-full flex flex-col z-10 gap-6">
            <p class="text-3xl font-semibold text-left mt-12">Welcome Back</p>

            <div class="flex flex-col w-full">
              <label class="ml-4" for="email">Enter your Email:</label>
              <br />
              <input
                class="border-white bg-slate-50 border-2 rounded-3xl w-[605px] h-[59px] ml-4 p-2"
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
              />
            </div>
            <div class="flex flex-col w-full">
              <label class="ml-4" for="password">Enter your password:</label>
              <br />
              <input
                class="border-white bg-slate-50 border-2 rounded-3xl w-[605px] h-[59px]  ml-4 p-2"
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
              />
            </div>

            <div>
              
          
              <select name="login-type" id="login-type" class="bg-white w-[308px] h-[60px] rounded-lg ml-4 mt-4">
               
                <option value="student">Select login type</option>
                <option value="student">Student</option>
                <option value="college">College</option>

              </select>
              </div>


            <div class="flex justify-end mt-20 gap-3">

              <button class="bg-red-400 border-black text-white w-[176px] h-[49px] border-2 rounded-3xl p-1">Login</button>

              <button class=" border-black text-back w-[176px] h-[49px] border-2 rounded-3xl p-1">Forgot Password? </button>

            </div>  
              

            
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="flex items-center justify-center bg-red-600 h-[61px] mt-11 w-full">

<p class="text-white">Copyright © 2018 Federation of Computer Association Nepal (CAN Federation) | All rights reserved</p>

      </div>
    </footer>
  </body>
</html>
